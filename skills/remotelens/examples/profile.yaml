# Repository-owned example. The public API is ready to use; replace the path
# and local matching preferences as needed. Use localhost only for local dev.
api_base_url: https://remotelens.co/api/v1
cv_path: /absolute/path/to/the/cv-you-selected.md

profile:
  skills:
    - TypeScript
    - React
    - distributed systems
  preferred_countries:
    - CN
  employment_types:
    - full_time
  seniority: senior
  work_authorization: unknown
  travel_preference: no

matching:
  max_jobs: 25
  include_closed: false
